name: HarmonyOS test APK

on:
  push:
    branches:
      - codex/fix-harmonyos-qs-tile
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: harmonyos-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.4'
  GO_VERSION: '1.26.4'
  NDK_VERSION: r28c

jobs:
  apk:
    if: github.repository == 'h0zr/FlClash'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: core/go.sum

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true
          link-to-sdk: true

      - uses: gradle/actions/setup-gradle@v6

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: plugins/rust_api/rust
          cache-directories: .dart_tool/hooks_runner

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test Flutter service integration
        run: flutter test test/core/service_test.dart test/core/protocol_contract_test.dart

      - name: Test Android service lifecycle
        working-directory: android
        run: |
          printf 'flutter.sdk=%s\nsdk.dir=%s\n' "$FLUTTER_ROOT" "$ANDROID_HOME" > local.properties
          wrapper="$FLUTTER_ROOT/bin/cache/artifacts/gradle_wrapper"
          test -d "$wrapper" || flutter precache
          cp -R "$wrapper/." .
          chmod +x gradlew
          ./gradlew :common:testDebugUnitTest :service:testDebugUnitTest :app:testDebugUnitTest \
            -x :app:compileFlutterBuildDebug -x :app:copyFlutterAssetsDebug

      - name: Build ARM64 test APK
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: flutter build apk --release --target-platform android-arm64 --split-per-abi

      - name: Package APK and checksum
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "dist/FlClash-harmonyos-arm64-${GITHUB_SHA::7}.apk"
          cd dist
          sha256sum ./*.apk > SHA256SUMS
          echo 'ARM64 test APK: com.follow.clash.dev, debug signing; install alongside the official app.' >> "$GITHUB_STEP_SUMMARY"
          echo 'HarmonyOS 4.2/4.3 device verification is required; build success alone does not confirm the tile fix.' >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: FlClash-harmonyos-arm64-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
